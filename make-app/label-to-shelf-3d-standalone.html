renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.85;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.35;
scene.add(new THREE.HemisphereLight(0xffffff, 0x222233, 1));
const key = new THREE.DirectionalLight(0xffffff, 2.2); key.position.set(3, 5, 4); scene.add(key);
const rim = new THREE.DirectionalLight(0xb4aaff, 1.2); rim.position.set(0, 3, -5); scene.add(rim);

const shelf = new THREE.Mesh(new THREE.BoxGeometry(4, 0.06, 1.2), new THREE.MeshStandardMaterial({ color: "#6b4a2f", roughness: 0.7 }));
shelf.position.y = -0.03; scene.add(shelf);

const loader = new THREE.TextureLoader();
for (const ver of VERSIONS) {
  const g = new THREE.Group(); g.position.x = ver.x; scene.add(g);
  for (const part of ver.parts) {
    const geo = new THREE.LatheGeometry(part.rh.map(([r, h]) => new THREE.Vector2(r * MM, h * MM)), 96);
    g.add(new THREE.Mesh(geo, new THREE.MeshPhysicalMaterial({ color: part.color, roughness: 0.4, clearcoat: 0.5, side: THREE.DoubleSide })));
  }
  if (ver.label) {
    const L = ver.label, tex = loader.load(L.src);
    tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 8;
    const sleeve = new THREE.Mesh(
      new THREE.CylinderGeometry(L.r * MM, L.r * MM, (L.b1 - L.b0) * MM, 128, 1, true, -L.angle / 2, L.angle),
      new THREE.MeshPhysicalMaterial({ map: tex, roughness: 0.5, clearcoat: 0.2, side: THREE.DoubleSide })
    );
    sleeve.position.y = ((L.b0 + L.b1) / 2) * MM;
    g.add(sleeve);
  }
}

const camera = new THREE.PerspectiveCamera(32, 1, 0.01, 100);
camera.position.fromArray(CAMERA);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.fromArray(TARGET);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI / 2 - 0.05;
controls.update();

function fit() {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
}
addEventListener("resize", fit);
fit();

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
