<text x="483" y="451.0" fill="#F1EFE5" font-family="Arial" font-size="11">01   White cosmos</text>
<text x="483" y="464.75" fill="#F1EFE5" font-family="Arial" font-size="11">02   White sweet alyssum</text>
<text x="483" y="478.5" fill="#F1EFE5" font-family="Arial" font-size="11">03   Evening primrose</text>
<text x="483" y="492.25" fill="#F1EFE5" font-family="Arial" font-size="11">       + A field guide to growing</text>
<text x="483" y="551.0" fill="#F1EFE5" font-family="Arial" font-size="8">Seeds for sowing. Not for consumption.</text>
<text x="483" y="561.0" fill="#F1EFE5" font-family="Arial" font-size="8">Store in a cool, dry place.</text>
<text x="483" y="571.0" fill="#F1EFE5" font-family="Arial" font-size="8">FIELDWORK / MOON GARDEN / No. 001</text>
