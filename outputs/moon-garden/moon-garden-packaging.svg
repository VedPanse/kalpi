<text x="483" y="259.0" fill="#F1EFE5" font-family="Georgia" font-size="28">IS IN BLOOM.</text>
<text x="483" y="299.0" fill="#F1EFE5" font-family="Arial" font-size="12">Make a little room for dusk.</text>
<text x="483" y="314.0" fill="#F1EFE5" font-family="Arial" font-size="12">A collection of pale flowers</text>
<text x="483" y="329.0" fill="#F1EFE5" font-family="Arial" font-size="12">for a garden that glows as</text>
<text x="483" y="344.0" fill="#F1EFE5" font-family="Arial" font-size="12">the day slows down.</text>
