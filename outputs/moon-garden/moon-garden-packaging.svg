<text x="620" y="1250.0" fill="#182C31" font-family="Arial" font-size="14">1. EDIT THE ART</text>
<text x="620" y="1287.0" fill="#6A7775" font-family="Arial" font-size="14">Edit the text, colours and vectors.</text>
<text x="620" y="1304.5" fill="#6A7775" font-family="Arial" font-size="14">Keep artwork and fold guides in</text>
<text x="620" y="1322.0" fill="#6A7775" font-family="Arial" font-size="14">separate layers in Figma.</text>
<text x="985" y="1250.0" fill="#182C31" font-family="Arial" font-size="14">2. MAKE A DUMMY</text>
<text x="985" y="1287.0" fill="#6A7775" font-family="Arial" font-size="14">Print at the intended dimensions.</text>
<text x="985" y="1304.5" fill="#6A7775" font-family="Arial" font-size="14">Cut, score and fold, then test the fit</text>
<text x="985" y="1322.0" fill="#6A7775" font-family="Arial" font-size="14">with the sachets and growing guide.</text>
<text x="1350" y="1250.0" fill="#182C31" font-family="Arial" font-size="14">3. PREPARE FOR PRINT</text>
<text x="1350" y="1287.0" fill="#6A7775" font-family="Arial" font-size="14">Ask your printer to verify the net,</text>
<text x="1350" y="1304.5" fill="#6A7775" font-family="Arial" font-size="14">add 3 mm bleed and 4 mm safe areas,</text>
<text x="1350" y="1322.0" fill="#6A7775" font-family="Arial" font-size="14">and confirm board stock and colour.</text>
<text x="620" y="1455.0" fill="#6A7775" font-family="Arial" font-size="10">DESIGN STUDY / NOT A PRODUCTION-APPROVED DIELINE</text>
</svg>