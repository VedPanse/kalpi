<text x="743" y="424.0" fill="#182C31" font-family="Arial" font-size="10">03 / PAUSE</text>
<text x="743" y="436.5" fill="#182C31" font-family="Arial" font-size="10">Watch the</text>
<text x="743" y="449.0" fill="#182C31" font-family="Arial" font-size="10">evening bloom.</text>
