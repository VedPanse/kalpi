<g font-family="Helvetica,Arial,sans-serif" fill="#203c3e">
 <text x="125" y="295" font-size="13" letter-spacing="2">01 / PRODUCT VIEW</text>
 <text x="125" y="1193" font-size="26">Warm light. Cool silhouette.</text>
 <text x="125" y="1225" font-size="16" fill="#63736b">Spun aluminium · brushed brass · terracotta ceramic</text>
 <text x="1340" y="293" font-size="13" letter-spacing="2">02 / DESIGN INTENT</text>
 <text x="1340" y="350" font-size="32" font-weight="700">Light, grounded.</text>
 <text x="1340" y="398" font-size="19">A broad, low dome floats</text>
 <text x="1340" y="429" font-size="19">above a tapered ceramic</text>
 <text x="1340" y="460" font-size="19">base on a fine brass stem.</text>
 <path d="M1340 510H1710" stroke="#c7ccc3"/>
 <text x="1340" y="554" font-size="13" letter-spacing="2">PROPOSED DIMENSIONS</text>
 <text x="1340" y="603" font-size="22">Width</text><text x="1710" y="603" text-anchor="end" font-size="22" font-weight="700">320 mm</text>
 <text x="1340" y="646" font-size="22">Depth</text><text x="1710" y="646" text-anchor="end" font-size="22" font-weight="700">320 mm</text>
 <text x="1340" y="689" font-size="22">Height</text><text x="1710" y="689" text-anchor="end" font-size="22" font-weight="700">420 mm</text>
 <text x="1340" y="735" font-size="15" fill="#63736b">Concept dimensions, not measured.</text>
 <path d="M1340 780H1710" stroke="#c7ccc3"/>
 <text x="1340" y="825" font-size="13" letter-spacing="2">MATERIAL &amp; FINISH</text>
 <rect x="1340" y="854" width="54" height="54" rx="27" fill="#305e60"/>
 <text x="1415" y="878" font-size="18" font-weight="700">Petrol aluminium</text><text x="1415" y="902" font-size="15">Matte powder coat</text>
 <rect x="1340" y="935" width="54" height="54" rx="27" fill="#bdab7c"/>
 <text x="1415" y="959" font-size="18" font-weight="700">Brushed brass</text><text x="1415" y="983" font-size="15">Stem &amp; rotary dimmer</text>
 <rect x="1340" y="1016" width="54" height="54" rx="27" fill="#c67a56"/>
 <text x="1415" y="1040" font-size="18" font-weight="700">Terracotta ceramic</text><text x="1415" y="1064" font-size="15">Unglazed, fine texture</text>
 <text x="1340" y="1160" font-size="16">Single product. One clear view.</text>
 <text x="1340" y="1190" font-size="16">Designed for image-to-3D testing.</text>
 <path d="M90 1300H1710" stroke="#c7ccc3"/>
 <text x="90" y="1345" font-size="14" fill="#63736b">ARC / 03 — Table lamp concept · Editable vector artwork · No 3D generation included</text>
 <text x="1710" y="1345" text-anchor="end" font-size="14" fill="#63736b">OBJECT STUDY 03 / 2026</text>
