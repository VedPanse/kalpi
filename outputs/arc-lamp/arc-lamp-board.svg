 <text x="90" y="170" font-size="64" font-weight="700" letter-spacing="-3">ARC / 03</text>
 <text x="1405" y="100" font-size="18">A small pool of warmth.</text>
 <text x="1405" y="130" font-size="18">A quiet sculptural presence.</text>
 <path d="M90 210H1710" stroke="#c7ccc3"/>
</g>
