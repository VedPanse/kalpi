 <g id="Brass-dimmer"><ellipse cx="784" cy="988" rx="13" ry="7" fill="#705638"/><path d="M772 986V969Q784 959 796 969V986Q784 995 772 986Z" fill="url(#brass)"/><ellipse cx="784" cy="969" rx="12" ry="5" fill="#d4bf8c"/></g>
