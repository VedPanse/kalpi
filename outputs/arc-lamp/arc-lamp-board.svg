<title>ARC / 03 — sculptural table lamp</title>
<defs>
 <linearGradient id="shade" x1="0" y1="0" x2="1" y2=".4"><stop stop-color="#163f43"/><stop offset=".32" stop-color="#527d79"/><stop offset=".6" stop-color="#305e60"/><stop offset="1" stop-color="#123b40"/></linearGradient>
 <linearGradient id="brass"><stop stop-color="#6e5935"/><stop offset=".22" stop-color="#bdab7c"/><stop offset=".44" stop-color="#e5d4a2"/><stop offset=".65" stop-color="#bca371"/><stop offset="1" stop-color="#715d39"/></linearGradient>
 <linearGradient id="base" x1="0" x2="1"><stop stop-color="#9f4f37"/><stop offset=".28" stop-color="#cc7c58"/><stop offset=".55" stop-color="#d68b65"/><stop offset="1" stop-color="#985038"/></linearGradient>
