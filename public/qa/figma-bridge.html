<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Kalpi · Figma bridge development fixture</title><style>body{margin:0;background:#e6e8df;font:12px sans-serif;display:flex;justify-content:center;gap:30px;padding:25px}aside{width:230px;padding-top:30px;line-height:1.7;color:#56654c}iframe{width:560px;height:1100px;border:1px solid #c6ceba;border-radius:10px}button{padding:12px;cursor:pointer}</style></head><body><aside><h2>Development fixture</h2><p>This simulates the Figma message bridge for browser testing. It is not a live Figma connection.</p><button id="change">Simulate label edit</button><p id="status">No canvas writes. Results insertion is simulated.</p></aside><iframe title="Kalpi plugin panel test fixture" src="/figma-panel.html"></iframe><script>
const frame=document.querySelector('iframe');let edited=false;
function sendLabel(){const canvas=document.createElement('canvas');canvas.width=512;canvas.height=608;const c=canvas.getContext('2d');c.fillStyle='#f1eddf';c.fillRect(0,0,512,608);c.fillStyle='#324029';c.textAlign='center';c.font='19px sans-serif';c.fillText('DEVELOPMENT FIXTURE',256,110);c.font='64px Georgia';c.fillText(edited?'TERRA':'SOLA',256,310);c.font='17px sans-serif';c.fillText('NOT A LIVE FIGMA EXPORT',256,500);canvas.toBlob(async blob=>frame.contentWindow.postMessage({type:'label',bytes:Array.from(new Uint8Array(await blob.arrayBuffer())),name:edited?'Development fixture — Terra':'Development fixture — Sola',sourceReference:{provider:'figma',fileKey:null,nodeId:'fixture:1',nodeName:'Development fixture',exportedAt:new Date().toISOString()}},location.origin))}
window.onmessage=event=>{if(event.source!==frame.contentWindow||event.origin!==location.origin)return;if(['ready','refresh'].includes(event.data.type))sendLabel();if(event.data.type==='insert-results'){document.querySelector('#status').textContent='Received actual results payload: '+event.data.text;frame.contentWindow.postMessage({type:'results-inserted'},location.origin)}};
document.querySelector('#change').onclick=()=>{edited=!edited;sendLabel()};
</script></body></html>
