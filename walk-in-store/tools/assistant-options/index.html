<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Assistant Options</title>
<style>
:root{--bg:#f4f2ee;--fg:#16171b;--mut:#6b6a72;--card:#fff;--line:#e3ded5;--acc:#b4aaff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0b10;--fg:#f4f3f7;--mut:#a09eab;--card:#16151d;--line:#25242e}}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 Inter,system-ui,sans-serif}
main{max-width:1200px;margin:auto;padding:32px 16px}
h1{margin:0 0 6px;font-size:28px}p.sub{margin:0 0 24px;color:var(--mut)}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.c{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.c canvas{display:block;width:100%;height:320px}
.c div{padding:12px 14px 16px}.c b{font-size:17px}.c p{margin:4px 0 0;color:var(--mut);font-size:14px}
</style>
<main><h1>Who should help shoppers?</h1><p class="sub">Eleven options: free animated three.js characters, plus two built in code for the brand. The assistant would walk to the product you click, carry it, and take you to checkout.</p>
<div class="g" id="g"></div></main>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
const BASE = "https://cdn.jsdelivr.net/gh/mrdoob/three.js@r170/examples/models/gltf/";
const KH = "https://cdn.jsdelivr.net/gh/KhronosGroup/glTF-Sample-Assets@main/Models/";
const OPTIONS = [
  { letter: "A", name: "Friendly robot", file: BASE + "RobotExpressive/RobotExpressive.glb", clip: "Wave", note: "Cartoon robot. Waves, walks, runs, jumps, thumbs-up. Smallest file, loads fastest.", scale: 0.38 },
  { letter: "B", name: "Mannequin", file: BASE + "Xbot.glb", clip: "walk", note: "Clean grey human figure. Idle, walk, run. Neutral, fits any brand.", scale: 1 },
  { letter: "C", name: "Shop worker", file: BASE + "Soldier.glb", clip: "Walk", note: "Realistic human. Idle, walk, run. Most lifelike, but the outfit looks military.", scale: 1 },
  { letter: "D", name: "Dancer", file: BASE + "Michelle.glb", clip: "", note: "Realistic woman. Only a dance animation, so she can't walk yet.", scale: 1 },
  { letter: "E", name: "Walking man", file: KH + "CesiumMan/glTF-Binary/CesiumMan.glb", clip: "", note: "Simple textured man with a steady walk. Small file. Low detail, a bit retro.", scale: 1.1, rot: -Math.PI / 2 + 0.4 },
  { letter: "F", name: "Stick figure", file: KH + "RiggedFigure/glTF-Binary/RiggedFigure.glb", clip: "", note: "Minimal blank figure with a walk. Tiny file; would need colouring for the brand.", scale: 1.6, rot: -Math.PI / 2 + 0.4 },
  { letter: "G", name: "Dancing robot", file: KH + "BrainStem/glTF-Binary/BrainStem.glb", clip: "", note: "Shiny robot with a lively dance loop. Fun for a launch; no walk.", scale: 1.05 },
  { letter: "H", name: "Fox mascot", file: KH + "Fox/glTF-Binary/Fox.glb", clip: "Walk", note: "Low-poly fox that walks and runs. A playful store mascot instead of a person.", scale: 0.012 },
  { letter: "I", name: "Parrot guide", file: BASE + "Parrot.glb", clip: "", note: "Flying parrot. Could fly ahead of you to the product, then to checkout.", scale: 0.012, y: 1.1 },
  { letter: "J", name: "Olive mascot (custom)", custom: "olive", note: "Built in code for Graza: a green olive with eyes and little legs. Fully on-brand; we can restyle it for any shop.", scale: 1 },
  { letter: "K", name: "Shop clerk (custom)", custom: "clerk", note: "Built in code: a simple, friendly clerk with an apron in the shop's colours. Walks with a bob, waves.", scale: 1 },
];
const g = document.getElementById("g"), loader = new GLTFLoader(), clock = new THREE.Clock(), mixers = [], views = [], customs = [];
const mat = (c, r = 0.5) => new THREE.MeshStandardMaterial({ color: c, roughness: r });
function eyes(group, y, z, s) {
  for (const x of [-1, 1]) {
    const w = new THREE.Mesh(new THREE.SphereGeometry(0.09 * s, 20, 16), mat("#ffffff", 0.3)); w.position.set(x * 0.12 * s, y, z); group.add(w);
    const p = new THREE.Mesh(new THREE.SphereGeometry(0.045 * s, 16, 12), mat("#16171b", 0.2)); p.position.set(x * 0.12 * s, y, z + 0.07 * s); group.add(p);
  }
}
function olive() {
  const g = new THREE.Group(), body = new THREE.Mesh(new THREE.SphereGeometry(0.42, 40, 32), mat("#6f8f2e", 0.35));
  body.scale.set(0.85, 1.12, 0.85); body.position.y = 1.0; g.add(body);
  const leaf = new THREE.Mesh(new THREE.SphereGeometry(0.16, 20, 12), mat("#c9e265", 0.4)); leaf.scale.set(1.6, 0.3, 0.7); leaf.position.set(0.12, 1.5, 0); leaf.rotation.z = -0.5; g.add(leaf);
  eyes(g, 1.1, 0.3, 1);
  const legs = [];
  for (const x of [-1, 1]) { const l = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, 0.5, 10), mat("#2f3a1f")); l.position.set(x * 0.15, 0.3, 0); g.add(l); legs.push(l);
    const f = new THREE.Mesh(new THREE.SphereGeometry(0.08, 14, 10), mat("#2f3a1f")); f.scale.set(1, 0.5, 1.5); f.position.set(x * 0.15, 0.05, 0.04); g.add(f); legs.push(f); }
  g.userData.tick = (t) => { body.position.y = 1.0 + Math.abs(Math.sin(t * 6)) * 0.05; legs.forEach((l, i) => (l.position.z = Math.sin(t * 6 + (i < 2 ? 0 : Math.PI)) * 0.08)); g.rotation.y = 0.3 + Math.sin(t * 0.6) * 0.4; };
  return g;
}
function clerk() {
  const g = new THREE.Group();
  const torso = new THREE.Mesh(new THREE.CapsuleGeometry(0.24, 0.55, 8, 20), mat("#f4f2ee")); torso.position.y = 1.0; g.add(torso);
  const apron = new THREE.Mesh(new THREE.CylinderGeometry(0.255, 0.27, 0.6, 32, 1, true, -1.1, 2.2), mat("#6f8f2e")); apron.position.y = 0.92; g.add(apron);
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.2, 32, 24), mat("#e7c4a3", 0.6)); head.position.y = 1.62; g.add(head);
  const hair = new THREE.Mesh(new THREE.SphereGeometry(0.205, 32, 24, 0, Math.PI * 2, 0, Math.PI / 2), mat("#3b2a20", 0.8)); hair.position.y = 1.64; hair.rotation.x = -0.25; g.add(hair);
  eyes(g, 1.64, 0.17, 0.55);
  const arm = new THREE.Mesh(new THREE.CapsuleGeometry(0.06, 0.4, 6, 12), mat("#f4f2ee")); arm.position.set(0.32, 1.2, 0); g.add(arm);
  const arm2 = arm.clone(); arm2.position.x = -0.32; arm2.position.y = 0.95; g.add(arm2);
  const legs = [];
  for (const x of [-1, 1]) { const l = new THREE.Mesh(new THREE.CapsuleGeometry(0.08, 0.45, 6, 12), mat("#2a2c31")); l.position.set(x * 0.11, 0.33, 0); g.add(l); legs.push(l); }
  g.userData.tick = (t) => { arm.rotation.z = 2.4 + Math.sin(t * 5) * 0.35; legs.forEach((l, i) => (l.rotation.x = Math.sin(t * 5 + i * Math.PI) * 0.35)); g.position.y = Math.abs(Math.sin(t * 5)) * 0.03; g.rotation.y = 0.3 + Math.sin(t * 0.6) * 0.4; };
  return g;
}
for (const o of OPTIONS) {
  const card = document.createElement("div"); card.className = "c";
  card.innerHTML = `<canvas></canvas><div><b>${o.letter} · ${o.name}</b><p>${o.note}</p></div>`;
  g.appendChild(card);
  const canvas = card.querySelector("canvas");
  const r = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true }); r.setPixelRatio(Math.min(devicePixelRatio, 2));
  const scene = new THREE.Scene();
  scene.add(new THREE.HemisphereLight(0xffffff, 0x8d8d8d, 3));
  const d = new THREE.DirectionalLight(0xffffff, 2.5); d.position.set(2, 4, 3); scene.add(d);
  const cam = new THREE.PerspectiveCamera(35, 1, 0.1, 50); cam.position.set(0, 1.1, 4.2); cam.lookAt(0, 0.9, 0);
  views.push({ r, scene, cam, canvas });
  if (o.custom) { const m = o.custom === "olive" ? olive() : clerk(); scene.add(m); customs.push(m); continue; }
  loader.load(o.file, (gltf) => {
    const m = gltf.scene; m.scale.setScalar(o.scale); m.rotation.y = o.rot ?? 0.4; if (o.y) m.position.y = o.y; scene.add(m);
    const mixer = new THREE.AnimationMixer(m);
    const clip = gltf.animations.find((a) => a.name === o.clip) || gltf.animations[0];
    if (clip) mixer.clipAction(clip).play();
    mixers.push(mixer);
  });
}
function loop() {
  requestAnimationFrame(loop);
  const dt = clock.getDelta(), t = clock.elapsedTime; mixers.forEach((m) => m.update(dt)); customs.forEach((m) => m.userData.tick(t));
  for (const v of views) { const w = v.canvas.clientWidth, h = v.canvas.clientHeight; if (v.canvas.width !== w * 2) { v.r.setSize(w, h, false); v.cam.aspect = w / h; v.cam.updateProjectionMatrix(); } v.r.render(v.scene, v.cam); }
}
loop();
</script></html>
